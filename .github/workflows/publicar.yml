name: Atualizar e publicar

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 21 * * 1-5"   # dias úteis, 18:30 em Brasília (após o fechamento da B3)
  workflow_dispatch:           # botão "Run workflow" para rodar na hora
    inputs:
      fundamentos:
        description: "Quantos ativos do exterior renovar no cache de fundamentos"
        default: "1500"
      so_acoes:
        description: "Coletar só as ações da B3 (as outras classes ficam com os dados publicados)"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      COLETAR: ${{ github.event_name != 'push' }}
      SITE: https://roberthy12.github.io/fundamento-b3
    steps:
      - uses: actions/checkout@v7

      # Num push (mudança de código) não coleta: reaproveita os dados já publicados.
      - name: Reaproveitar dados publicados
        if: env.COLETAR != 'true'
        continue-on-error: true
        run: |
          mkdir -p dados
          curl -sfL "$SITE/acoes.json" -o acoes.json.pub && mv acoes.json.pub acoes.json || true
          for f in fiis b3 exterior etfs_exterior fundos tesouro busca referencias; do
            curl -sfL "$SITE/dados/$f.json" -o "dados/$f.json" || rm -f "dados/$f.json"
          done
          ls -la dados

      # Guarda o histórico de cada empresa e os fundamentos do exterior entre execuções.
      - name: Restaurar cache
        uses: actions/cache/restore@v6
        with:
          path: |
            dados/cache_fundamentos.json
            dados/cache_acoes.json
            dados/empresas
          key: fundamentos-${{ github.run_id }}
          restore-keys: fundamentos-

      # Balanços da CVM, cadastro e proventos da B3, cotações do Yahoo.
      - name: Ações brasileiras
        if: env.COLETAR == 'true'
        continue-on-error: true
        run: python3 robo/acoes.py

      - name: FIIs
        if: env.COLETAR == 'true' && inputs.so_acoes != true
        continue-on-error: true
        run: python3 robo/fiis.py

      - name: ETFs, BDRs, Fiagros e FI-Infra
        if: env.COLETAR == 'true' && inputs.so_acoes != true
        continue-on-error: true
        run: python3 robo/b3.py

      - name: Exterior
        if: env.COLETAR == 'true' && inputs.so_acoes != true
        continue-on-error: true
        env:
          MAX_FUNDAMENTOS: ${{ inputs.fundamentos || '1500' }}
        run: python3 robo/exterior.py

      - name: Fundos de investimento
        if: env.COLETAR == 'true' && inputs.so_acoes != true
        continue-on-error: true
        run: python3 robo/fundos.py

      - name: Tesouro Direto
        if: env.COLETAR == 'true' && inputs.so_acoes != true
        continue-on-error: true
        run: python3 robo/tesouro.py

      # O que falhou hoje continua com a versão publicada ontem.
      - name: Completar com dados publicados
        if: env.COLETAR == 'true'
        continue-on-error: true
        run: |
          [ -s acoes.json ] || curl -sfL "$SITE/acoes.json" -o acoes.json || rm -f acoes.json
          for f in fiis b3 exterior etfs_exterior fundos tesouro referencias; do
            [ -s "dados/$f.json" ] || curl -sfL "$SITE/dados/$f.json" -o "dados/$f.json" || rm -f "dados/$f.json"
          done
          python3 robo/indice.py

      - name: Guardar cache
        if: env.COLETAR == 'true' && always()
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: |
            dados/cache_fundamentos.json
            dados/cache_acoes.json
            dados/empresas
          key: fundamentos-${{ github.run_id }}

      - name: Montar o site
        run: |
          mkdir -p _site/dados/empresas
          cp *.html *.js *.json *.webmanifest *.png _site/
          cp dados/*.json _site/dados/ 2>/dev/null || true
          cp dados/empresas/*.json _site/dados/empresas/ 2>/dev/null || true
          rm -f _site/dados/cache_*.json
          ls -la _site _site/dados
          echo "empresas: $(ls _site/dados/empresas | wc -l)"

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v5
