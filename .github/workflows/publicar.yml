name: Atualizar e publicar

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 21 * * 1-5"   # dias úteis, 18:30 em Brasília (após o fechamento da B3)
  workflow_dispatch:           # botão "Run workflow" para rodar na hora

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Atualizar indicadores
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          BRAPI_TOKEN: ${{ secrets.BRAPI_TOKEN }}
        run: python3 atualizar_dados.py

      - name: Guardar dados novos no repositório
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add acoes.json
          git diff --cached --quiet || { git commit -m "Dados de $(TZ=America/Sao_Paulo date +%d/%m/%Y)"; git push; }

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - id: deploy
        uses: actions/deploy-pages@v5
