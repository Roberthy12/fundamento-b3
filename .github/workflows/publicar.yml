name: Atualizar e publicar

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 21 * * 1-5"   # dias úteis, 18:30 em Brasília (após o fechamento da B3)
  workflow_dispatch:           # botão "Run workflow" para rodar na hora
    inputs:
      fundamentos:
        description: "Quantos ativos do exterior renovar no cache de fundamentos"
        default: "1500"
      so_acoes:
        description: "Coletar só as ações da B3 (as outras classes ficam com os dados publicados)"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ env.SITE }}
    env:
      COLETAR: ${{ github.event_name != 'push' }}
      SITE: https://roberthy12.github.io/fundamento-b3
    steps:
      - uses: actions/checkout@v7

      # Num push (mudança de código) não coleta: reaproveita os dados já publicados.
      - name: Reaproveitar dados publicados
        if: env.COLETAR != 'true'
        continue-on-error: true
        run: |
          mkdir -p dados
          curl -sfL "$SITE/acoes.json" -o acoes.json.pub && mv acoes.json.pub acoes.json || true
          for f in fiis b3 exterior etfs_exterior fundos tesouro busca referencias perfil indices global precos_fii precos_b3 precos_ext precos_etfx cripto cripto_hist agenda fiis_imoveis fiis_imoveis_diag; do
            curl -sfL "$SITE/dados/$f.json" -o "dados/$f.json" || rm -f "dados/$f.json"
          done
          ls -la dados

      # Guarda o histórico de cada empresa e os fundamentos do exterior entre execuções.
      - name: Restaurar cache
        uses: actions/cache/restore@v6
        with:
          path: |
            dados/cache_fundamentos.json
            dados/cache_acoes.json
            dados/cache_precos_mensais.json
            dados/empresas
            dados/empresas_ext
            dados/exterior_hist.json
          key: fundamentos-${{ github.run_id }}
          restore-keys: fundamentos-

      # Balanços da CVM, cadastro e proventos da B3, cotações do Yahoo.
      - name: Ações brasileiras
        if: env.COLETAR == 'true'
        continue-on-error: true
        run: python3 robo/acoes.py

      # Ano de fundação e número de empregados (Formulário de Referência da CVM).
      - name: Perfil das empresas
        if: env.COLETAR == 'true'
        continue-on-error: true
        run: python3 robo/perfil.py

      # Composição dos índices da B3 (Ibovespa, IBrX, IDIV, Small Cap...).
      - name: Índices da B3
        if: env.COLETAR == 'true'
        continue-on-error: true
        run: python3 robo/indices.py

      # Séries diárias das ações, BDRs, Ibovespa e CDI (gráfico de investimentos).
      - name: Séries diárias
        if: env.COLETAR == 'true'
        continue-on-error: true
        run: python3 robo/diario.py

      - name: Empresas globais
        if: env.COLETAR == 'true'
        continue-on-error: true
        run: python3 robo/global_nord.py

      - name: FIIs
        if: env.COLETAR == 'true' && inputs.so_acoes != true
        continue-on-error: true
        run: python3 robo/fiis.py

      - name: Imóveis dos FIIs (vacância)
        if: env.COLETAR == 'true' && inputs.so_acoes != true
        continue-on-error: true
        run: python3 robo/fiis_imoveis.py

      - name: ETFs, BDRs, Fiagros e FI-Infra
        if: env.COLETAR == 'true' && inputs.so_acoes != true
        continue-on-error: true
        run: python3 robo/b3.py

      - name: Exterior
        if: env.COLETAR == 'true' && inputs.so_acoes != true
        continue-on-error: true
        env:
          MAX_FUNDAMENTOS: ${{ inputs.fundamentos || '1500' }}
        run: python3 robo/exterior.py

      - name: Fundos de investimento
        if: env.COLETAR == 'true' && inputs.so_acoes != true
        continue-on-error: true
        run: python3 robo/fundos.py

      - name: Tesouro Direto
        if: env.COLETAR == 'true' && inputs.so_acoes != true
        continue-on-error: true
        run: python3 robo/tesouro.py

      - name: Criptomoedas
        if: env.COLETAR == 'true' && inputs.so_acoes != true
        continue-on-error: true
        run: python3 robo/cripto.py

      # O que falhou hoje continua com a versão publicada ontem.
      - name: Completar com dados publicados
        if: env.COLETAR == 'true'
        continue-on-error: true
        run: |
          [ -s acoes.json ] || curl -sfL "$SITE/acoes.json" -o acoes.json || rm -f acoes.json
          for f in fiis b3 exterior etfs_exterior fundos tesouro referencias perfil indices global precos_fii precos_b3 precos_ext precos_etfx cripto cripto_hist agenda fiis_imoveis fiis_imoveis_diag; do
            [ -s "dados/$f.json" ] || curl -sfL "$SITE/dados/$f.json" -o "dados/$f.json" || rm -f "dados/$f.json"
          done
          python3 robo/indice.py

      - name: Cotações mensais de FIIs, ETFs e BDRs
        if: env.COLETAR == 'true'
        continue-on-error: true
        run: python3 robo/precos_mensais.py

      - name: Guardar cache
        if: env.COLETAR == 'true' && always()
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: |
            dados/cache_fundamentos.json
            dados/cache_acoes.json
            dados/cache_precos_mensais.json
            dados/empresas
            dados/empresas_ext
            dados/exterior_hist.json
          key: fundamentos-${{ github.run_id }}

      - name: Conferir quem sumiu da lista
        if: env.COLETAR == 'true'
        continue-on-error: true
        run: python3 robo/conferir.py

      - name: Montar o site
        run: |
          mkdir -p _site/dados/empresas _site/dados/empresas_ext _site/dados/diario
          cp *.html *.js *.json *.webmanifest *.png _site/
          cp dados/*.json _site/dados/ 2>/dev/null || true
          cp dados/empresas/*.json _site/dados/empresas/ 2>/dev/null || true
          cp dados/empresas_ext/*.json _site/dados/empresas_ext/ 2>/dev/null || true
          cp dados/diario/*.json _site/dados/diario/ 2>/dev/null || true
          rm -f _site/dados/cache_*.json
          ls -la _site _site/dados
          echo "empresas: $(ls _site/dados/empresas | wc -l)"

      - name: Preparar o navegador de teste
        id: pw
        continue-on-error: true
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i playwright@1.49.1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      # Se alguma tela quebrar, o site anterior continua no ar (o teste só roda se o navegador instalou).
      - name: Teste de tela
        if: steps.pw.outcome == 'success'
        run: NODE_PATH=/tmp/pw/node_modules node robo/teste_tela.js _site

      - uses: actions/configure-pages@v5

      - id: up
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true

      # O GitHub às vezes falha ao publicar ("artifact not found"): espera e tenta de novo, até 3 vezes.
      - name: Aguardar antes da segunda tentativa
        if: steps.deploy.outcome == 'failure'
        run: sleep 90
      - id: deploy2
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Aguardar antes da terceira tentativa
        if: steps.deploy.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 240
      - id: deploy3
        if: steps.deploy.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true

      # Reserva: se a ação oficial não achar o arquivo do site, pede a publicação direto à API do Pages.
      - name: Publicar direto pela API do Pages
        if: steps.deploy.outcome == 'failure' && steps.deploy2.outcome == 'failure' && steps.deploy3.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          AID=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '[.artifacts[] | select(.name=="github-pages")][0].id // empty')
          echo "id do arquivo do site: ${AID:-nenhum}"
          [ -n "$AID" ] || exit 1
          OIDC=$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://github.com/$GITHUB_REPOSITORY_OWNER" | python3 -c "import sys,json;print(json.load(sys.stdin)['value'])")
          RESP=$(gh api -X POST "repos/$GITHUB_REPOSITORY/pages/deployments" -F artifact_id="$AID" -f pages_build_version="$GITHUB_SHA" -f oidc_token="$OIDC")
          echo "$RESP"
          URL=$(echo "$RESP" | python3 -c "import sys,json;print(json.load(sys.stdin).get('status_url',''))")
          for i in $(seq 1 40); do
            ST=$(gh api "$URL" --jq .status 2>/dev/null || echo "?")
            echo "status: $ST"
            case "$ST" in succeed*|deployed) exit 0;; failed|error) exit 1;; esac
            sleep 10
          done
          exit 1
